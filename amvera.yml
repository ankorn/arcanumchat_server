meta:
  environment: python
  toolchain:
    name: pip
    version: "3.12"
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  scriptName: null
  command: uvicorn main:app --host 0.0.0.0 --port 80
  persistenceMount: /data
  containerPort: 80
  russianTrustedCa: false
  singleton: true
  zeroDowntime: false